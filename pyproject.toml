[project]
name = "pairwise-compare"
dynamic = ["version"]  # from the latest git tag (hatch-vcs)
description = "Allows the user to compare groups of data specified in a tidy pandas dataframe with ease."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Cameron Mattson", email = "mattsoncameron1@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.1.3",
]

[project.urls]
Homepage = "https://github.com/WayScience/pairwise_compare"

[dependency-groups]
# installed by `uv sync`
dev = [
    "pytest>=8.3.3",
    "pyarrow>=18.0.0",  # the tests read a parquet file
]
docs = [
    { include-group = "dev" },
    "matplotlib>=3.9.2",
    "notebook>=7.2.2",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pairwise_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
