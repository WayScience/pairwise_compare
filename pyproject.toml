[project]
name = "pairwise-compare"
dynamic = ["version"]  # from the latest git tag (setuptools-scm)
description = "Allows the user to compare groups of data specified in a tidy pandas dataframe with ease."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Cameron Mattson", email = "mattsoncameron1@gmail.com" },
    { name = "Gregory Way", email = "gregory.way@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.1.3",
]

[project.urls]
Homepage = "https://github.com/WayScience/pairwise_compare"

[dependency-groups]
# installed by `uv sync`
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pyarrow>=18.0.0",  # the tests read parquet files
    "scikit-learn>=1.3",  # the iris and wine datasets of the tests
    "hypothesis>=6.100",  # the property-based test
]
docs = [
    { include-group = "dev" },
    "matplotlib>=3.9.2",
    "notebook>=7.2.2",
]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pairwise_compare"]

[tool.coverage.report]
show_missing = true
